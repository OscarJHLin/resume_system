name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS
          - platform: windows-latest
            label: Windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: npm ci
        run: npm ci

      - name: Prepare desktop bundle (web + templates)
        run: npm run desktop:prepare

      - name: Build Tauri + upload Release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 拼履 ${{ github.ref_name }}
          releaseBody: |
            ## 拼履 ${{ github.ref_name }}

            Windows / macOS 桌面修复补丁（WebView2 UX）。

            ### 下载安装
            - **macOS**: 下载 `Pinlu_*_*.dmg`，打开后拖到「应用程序」（Finder / 菜单栏显示 **拼履**）
            - **Windows**: 下载 `Pinlu_*_x64-setup.exe`（NSIS）并运行

            ### 本版修复（Windows 重点）
            - **导出**: Tauri IPC 优先走 `__TAURI_INTERNALS__`；原生保存对话框挂到主窗口（AsyncFileDialog）
            - **拖拽**: 修复 WebView2 dragend/drop 竞态；增加「放入」→ 点击画布区块的备用路径
            - **日期**: 逐步日期面板 portal + fixed，避免被模态 overflow 裁切

            ### 运行要求
            - **无需安装 Node.js**（进程内 Rust API）
            - 数据在系统 App Data，**不**携带开发者数据库

            ### 热更新
            已安装用户下次启动会检查 GitHub Release 的 `latest.json`，有新版本则自动下载并重启（需签名包）。

            ### 数据路径
            - macOS: `~/Library/Application Support/com.pinlu.desktop/resume.db`
            - Windows: `%APPDATA%\com.pinlu.desktop\resume.db`
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
