name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS
          - platform: windows-latest
            label: Windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: npm ci
        run: npm ci

      - name: Prepare desktop bundle (web + templates)
        run: npm run desktop:prepare

      - name: Build Tauri + upload Release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 拼履 ${{ github.ref_name }}
          releaseBody: |
            ## 拼履 ${{ github.ref_name }}

            Windows / macOS 桌面修复补丁（跨端拖拽）。

            ### 下载安装
            - **macOS**: 下载 `Pinlu_*_*.dmg`，打开后拖到「应用程序」（Finder / 菜单栏显示 **拼履**）
            - **Windows**: 下载 `Pinlu_*_x64-setup.exe`（NSIS）并运行

            ### 本版修复（v1.5.3）
            - **拖拽**: 修正会话生命周期——dragend 不再抢在 drop 前清空；HTML5 拖拽开始时不触发 React 重渲染（避免 WKWebView 中断拖拽）
            - **「放入」**: 仍作为无障碍/备用路径；主路径拖拽应在 Mac 与 Windows 均可用
            - （v1.5.2 已含）导出 IPC / 日期面板 portal 修复保留

            ### 运行要求
            - **无需安装 Node.js**（进程内 Rust API）
            - 数据在系统 App Data，**不**携带开发者数据库

            ### 热更新
            已安装用户下次启动会检查 GitHub Release 的 `latest.json`，有新版本则自动下载并重启（需签名包）。

            ### 数据路径
            - macOS: `~/Library/Application Support/com.pinlu.desktop/resume.db`
            - Windows: `%APPDATA%\com.pinlu.desktop\resume.db`
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # Belt-and-suspenders: tauri-action sometimes reports Win .exe upload success
      # but the asset never sticks on the Release. Keep CI artifacts + re-upload via gh.
      - name: Preserve Windows NSIS artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: pinlu-windows-nsis
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 14

      - name: Re-upload Windows NSIS via gh
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NSIS_DIR="apps/desktop/src-tauri/target/release/bundle/nsis"
          EXE=$(ls "$NSIS_DIR"/*-setup.exe | head -1)
          SIG="${EXE}.sig"
          test -f "$EXE"
          test -f "$SIG"
          ls -lh "$EXE" "$SIG"
          ZIP="${EXE%.exe}.zip"
          powershell.exe -NoProfile -Command "Compress-Archive -Path '$EXE' -DestinationPath '$ZIP' -Force"
          # tauri-action may already have uploaded; --clobber can 422 — delete then upload.
          for f in "$EXE" "$SIG" "$ZIP"; do
            name=$(basename "$f")
            gh release delete-asset "${{ github.ref_name }}" "$name" -y 2>/dev/null || true
            gh release upload "${{ github.ref_name }}" "$f"
          done
          echo "Uploaded:"
          gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name'
