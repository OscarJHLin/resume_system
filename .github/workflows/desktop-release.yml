name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS
          - platform: windows-latest
            label: Windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: npm ci
        run: npm ci

      - name: Prepare desktop bundle (web + templates)
        run: npm run desktop:prepare

      - name: Build Tauri + upload Release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 拼履 ${{ github.ref_name }} 正式版
          releaseBody: |
            ## 拼履 ${{ github.ref_name }} — 正式版（GA）

            首个非 Beta 正式发布。模块化简历：内容库 → 模板画布 → DOCX。

            ### 下载安装
            - **macOS**: 下载 `Pinlu_1.5.0_*.dmg`，打开后拖到「应用程序」（Finder / 菜单栏显示 **拼履**）
            - **Windows**: 下载 `Pinlu_1.5.0_x64-setup.exe`（NSIS）并运行

            ### 本版亮点
            - **拼履**品牌与 mint-green 应用图标
            - 基本信息卡一键复制
            - 导出 DOCX 使用系统原生保存对话框
            - 内容库删除可靠性修复
            - macOS 中文显示名 **拼履**（包产物仍为 ASCII `Pinlu_*`）

            ### 运行要求
            - **无需安装 Node.js**（进程内 Rust API）
            - 数据在系统 App Data，**不**携带开发者数据库

            ### 热更新
            已安装用户下次启动会检查 GitHub Release 的 `latest.json`，有新版本则自动下载并重启（需签名包）。

            ### 数据路径
            - macOS: `~/Library/Application Support/com.pinlu.desktop/resume.db`
            - Windows: `%APPDATA%\com.pinlu.desktop\resume.db`
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
